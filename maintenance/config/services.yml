services:
    salvocortesiano.maintenance.helper:
        class: salvocortesiano\maintenance\core\helper
        arguments:
            - '@config'
            - '@config_text'
            - '@template'
            - '@user'
            - '@language'
            - '@auth'
            - '@request'
            - '@path_helper'
            - '%core.root_path%'
            - '%core.php_ext%'
            - '%core.adm_relative_path%'

    salvocortesiano.maintenance.listener:
        class: salvocortesiano\maintenance\event\main_listener
        arguments:
            - '@salvocortesiano.maintenance.helper'
            - '@user'
            - '@auth'
            - '@request'
        tags:
            - { name: event.listener }

    salvocortesiano.maintenance.controller:
        class: salvocortesiano\maintenance\controller\main
        arguments:
            - '@salvocortesiano.maintenance.helper'
            - '@auth'
            - '@language'
