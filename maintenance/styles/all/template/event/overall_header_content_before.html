<!-- IF S_AGM_NOTICE or S_AGM_ADMIN_BANNER -->
<style>
.agm-notice {
	display: flex;
	align-items: flex-start;
	gap: 10px;
	margin: 10px 0;
	padding: 12px 16px;
	border: 1px solid #e0a800;
	border-left-width: 5px;
	border-radius: 4px;
	background: #fff8e1;
	color: #5c4600;
	font-size: 1.1em;
	line-height: 1.5;
}
.agm-notice-icon { flex-shrink: 0; line-height: 0; padding-top: 1px; color: #b8860b; }
.agm-notice-text { flex: 1; }
.agm-notice strong { white-space: nowrap; }
.agm-notice-admin { border-color: #2e7d32; background: #e8f5e9; color: #1b4d20; }
.agm-notice-admin .agm-notice-icon { color: #2e7d32; }
@media (max-width: 550px) {
	.agm-notice { font-size: 1em; padding: 10px 12px; }
}
</style>
<!-- ENDIF -->

<!-- IF S_AGM_ADMIN_BANNER -->
<div class="agm-notice agm-notice-admin" role="status">
	<span class="agm-notice-icon" aria-hidden="true">
		<svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm1 15h-2v-2h2v2Zm0-4h-2V7h2v6Z"/></svg>
	</span>
	<span class="agm-notice-text">{AGM_ADMIN_BANNER}</span>
</div>
<!-- ENDIF -->

<!-- IF S_AGM_NOTICE -->
<div class="agm-notice" role="status">
	<span class="agm-notice-icon" aria-hidden="true">
		<svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm1 15h-2v-2h2v2Zm0-4h-2V7h2v6Z"/></svg>
	</span>
	<span class="agm-notice-text">
		<!-- BEGIN agm_notice_part -->
			<!-- IF agm_notice_part.TS -->
				<strong data-agm-ts="{agm_notice_part.TS}">{agm_notice_part.TEXT}</strong>
			<!-- ELSE -->
				{agm_notice_part.TEXT}
			<!-- ENDIF -->
		<!-- END agm_notice_part -->
	</span>
</div>
<script>
(function () {
	'use strict';

	// Print the maintenance times in the reader's own timezone. The server
	// sends UNIX timestamps, so this shows the same moment to everyone.
	function pad(n) { return (n < 10 ? '0' : '') + n; }

	var stamps = document.querySelectorAll('.agm-notice [data-agm-ts]');

	for (var i = 0; i < stamps.length; i++) {
		var ts = parseInt(stamps[i].getAttribute('data-agm-ts'), 10);

		if (ts > 0) {
			var d = new Date(ts * 1000);
			stamps[i].textContent = pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
		}
	}
}());
</script>
<!-- ENDIF -->
